  </defs>
  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <text x="72" y="86" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#0F172A" letter-spacing="-0.5">Nova / Color exploration</text>
  <text x="72" y="118" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748B">Version 04 · Violet-to-cyan gradient system · AA checked</text>
  <g filter="url(#shadow)">
    <rect x="72" y="160" width="240" height="280" rx="24" fill="url(#swatch1)"/>
    <rect x="332" y="160" width="240" height="280" rx="24" fill="url(#swatch2)"/>
    <rect x="592" y="160" width="240" height="280" rx="24" fill="url(#swatch3)"/>
    <rect x="852" y="160" width="240" height="280" rx="24" fill="url(#swatch4)"/>
  </g>
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <text x="96" y="200" font-size="13" font-weight="600" fill="white" fill-opacity="0.7">PRIMARY</text>
    <text x="96" y="404" font-size="22" font-weight="700" fill="white">#6366F1</text>
    <text x="356" y="200" font-size="13" font-weight="600" fill="white" fill-opacity="0.7">ACCENT</text>
    <text x="356" y="404" font-size="22" font-weight="700" fill="white">#22D3EE</text>
    <text x="616" y="200" font-size="13" font-weight="600" fill="white" fill-opacity="0.7">ENERGY</text>
    <text x="616" y="404" font-size="22" font-weight="700" fill="white">#F472B6</text>
    <text x="876" y="200" font-size="13" font-weight="600" fill="white" fill-opacity="0.7">SUCCESS</text>
    <text x="876" y="404" font-size="22" font-weight="700" fill="white">#34D399</text>
  </g>
  <rect x="72" y="476" width="1020" height="208" rx="24" fill="white"/>
  <rect x="96" y="500" width="280" height="160" rx="16" fill="url(#hero)"/>
  <text x="404" y="542" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#0F172A" letter-spacing="-0.5">A gradient with a job.</text>
  <text x="404" y="574" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#64748B">It guides the eye toward action, then gets out of the way.</text>
  <g transform="translate(404 604)">
    <rect width="200" height="44" rx="22" fill="#6366F1"/>
    <text x="100" y="28" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="white">Primary action</text>
    <rect x="216" y="0" width="200" height="44" rx="22" fill="#EEF2FF"/>
    <text x="316" y="28" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#4338CA">Secondary</text>
  </g>
  <text x="404" y="676" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94A3B8">Text contrast 7.2:1 · UI contrast 4.9:1 · Dark surface ready</text>
