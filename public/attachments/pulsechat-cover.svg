<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" fill="none" role="img" aria-label="PulseChat — team chat with channels, threads and mentions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0b12"/>
      <stop offset="0.55" stop-color="#0f1020"/>
      <stop offset="1" stop-color="#0b0d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="300" y1="80" x2="760" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="send" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#7c6cff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="0" fill="url(#bg)"/>
  <circle cx="210" cy="90" r="260" fill="url(#glowA)"/>
  <circle cx="1030" cy="410" r="300" fill="url(#glowB)"/>
  <g opacity="0.35" stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 120h1200M0 240h1200M0 360h1200M200 0v480M400 0v480M600 0v480M800 0v480M1000 0v480"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(70 64)">
    <rect width="52" height="52" rx="16" fill="url(#accent)"/>
    <path d="M12 27h6.8l2.8-7.6 5 14.1 3.7-9.8 2.4 3.3H40" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="40" cy="27" r="2.4" fill="#fff" fill-opacity="0.9"/>
    <text x="70" y="24" fill="#f4f6ff" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="30" font-weight="800" letter-spacing="-0.8">PulseChat</text>
    <text x="70" y="46" fill="#8b93aa" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="3">TEAM CHAT WITH A PULSE</text>
  </g>

  <text x="70" y="222" fill="#f4f6ff" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="-1.6">Channels. Threads. Mentions.</text>
  <text x="70" y="268" fill="#a7aec4" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="18" font-weight="500">A realtime workspace that stays calm, focused, and beautifully in sync.</text>

  <g transform="translate(70 312)">
    <rect width="150" height="40" rx="20" fill="#7c6cff" fill-opacity="0.16" stroke="#7c6cff" stroke-opacity="0.4"/>
    <circle cx="25" cy="20" r="4" fill="#34d399"/>
    <text x="40" y="25" fill="#c7c2ff" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="13" font-weight="700">Realtime sync</text>

    <rect x="166" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="190" y="25" fill="#a7aec4" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="13" font-weight="600">Angular 22</text>

    <rect x="332" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="356" y="25" fill="#a7aec4" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="13" font-weight="600">Supabase</text>
  </g>

  <!-- App window -->
  <g transform="translate(604 62)" filter="url(#shadow)">
    <rect width="520" height="356" rx="22" fill="#101320" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect width="520" height="40" rx="22" fill="#171a27"/>
    <rect y="18" width="520" height="22" fill="#171a27"/>
    <circle cx="20" cy="20" r="4" fill="#fb7185"/>
    <circle cx="34" cy="20" r="4" fill="#fbbf24"/>
    <circle cx="48" cy="20" r="4" fill="#34d399"/>
    <rect x="200" y="12" width="120" height="16" rx="8" fill="#0d0f19"/>

    <!-- rail -->
    <rect x="16" y="56" width="42" height="42" rx="12" fill="url(#accent)" opacity="0.9"/>
    <rect x="16" y="108" width="42" height="42" rx="14" fill="#1e2232"/>
    <rect x="16" y="160" width="42" height="42" rx="14" fill="#1e2232"/>
    <rect x="16" y="292" width="42" height="42" rx="21" fill="#1e2232"/>
    <circle cx="37" cy="313" r="8" fill="#7c6cff" opacity="0.7"/>

    <!-- sidebar -->
    <rect x="72" y="56" width="148" height="284" rx="14" fill="#141826"/>
    <rect x="84" y="70" width="92" height="10" rx="5" fill="#d7dbea" opacity="0.85"/>
    <rect x="84" y="88" width="60" height="7" rx="3.5" fill="#5f667c"/>
    <rect x="84" y="116" width="124" height="18" rx="8" fill="#7c6cff" fill-opacity="0.16"/>
    <rect x="92" y="122" width="76" height="7" rx="3.5" fill="#a9a2ff"/>
    <rect x="84" y="142" width="110" height="7" rx="3.5" fill="#6b7288"/>
    <rect x="84" y="160" width="96" height="7" rx="3.5" fill="#6b7288"/>
    <rect x="84" y="186" width="48" height="6" rx="3" fill="#4c5368"/>
    <rect x="84" y="202" width="116" height="7" rx="3.5" fill="#6b7288"/>
    <rect x="84" y="220" width="104" height="7" rx="3.5" fill="#6b7288"/>
    <rect x="84" y="238" width="122" height="7" rx="3.5" fill="#6b7288"/>
    <rect x="84" y="264" width="48" height="6" rx="3" fill="#4c5368"/>
    <rect x="84" y="280" width="112" height="7" rx="3.5" fill="#6b7288"/>
    <rect x="84" y="298" width="92" height="7" rx="3.5" fill="#6b7288"/>

    <!-- chat -->
    <rect x="236" y="56" width="268" height="1" fill="#ffffff" fill-opacity="0.06"/>
    <text x="252" y="86" fill="#f1f3fb" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="800"># product-launch</text>
    <rect x="252" y="96" width="130" height="6" rx="3" fill="#5f667c"/>

    <!-- messages -->
    <circle cx="264" cy="136" r="12" fill="#f59e0b"/>
    <rect x="286" y="128" width="58" height="7" rx="3.5" fill="#d7dbea"/>
    <rect x="286" y="142" width="150" height="6" rx="3" fill="#6b7288"/>
    <rect x="286" y="156" width="118" height="6" rx="3" fill="#6b7288"/>

    <circle cx="264" cy="194" r="12" fill="#22d3ee"/>
    <rect x="286" y="186" width="70" height="7" rx="3.5" fill="#d7dbea"/>
    <rect x="286" y="200" width="140" height="6" rx="3" fill="#6b7288"/>
    <rect x="286" y="214" width="100" height="6" rx="3" fill="#6b7288"/>

    <!-- mention card -->
    <rect x="286" y="232" width="200" height="40" rx="10" fill="#7c6cff" fill-opacity="0.12" stroke="#7c6cff" stroke-opacity="0.28"/>
    <text x="298" y="249" fill="#a9a2ff" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="10" font-weight="700">@alex</text>
    <rect x="298" y="256" width="150" height="5" rx="2.5" fill="#6b7288"/>

    <!-- thread badge -->
    <rect x="286" y="284" width="96" height="20" rx="10" fill="#22d3ee" fill-opacity="0.1"/>
    <circle cx="296" cy="294" r="3" fill="#22d3ee"/>
    <text x="304" y="298" fill="#67e8f9" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="9" font-weight="700">6 replies</text>

    <!-- composer -->
    <rect x="244" y="316" width="252" height="38" rx="12" fill="#171a27" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="256" y="331" width="150" height="7" rx="3.5" fill="#4c5368"/>
    <rect x="462" y="324" width="24" height="24" rx="8" fill="url(#send)"/>
    <path d="M470 336l8-4-4 8-1.4-3.2L470 336z" fill="#fff"/>
  </g>
</svg>
