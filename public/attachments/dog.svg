<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FEF3C7"/>
      <stop offset="1" stop-color="#FCE7F3"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="420" x2="1000" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(780 150) rotate(90) scale(180)">
      <stop stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="700" rx="32" fill="url(#bg)"/>
  <circle cx="780" cy="150" r="180" fill="url(#sun)"/>
  <rect x="0" y="430" width="1000" height="270" fill="url(#desk)"/>
  <rect x="0" y="430" width="1000" height="18" fill="#B45309" fill-opacity="0.35"/>
  <g transform="translate(630 300)">
    <ellipse cx="110" cy="210" rx="150" ry="84" fill="#78350F" fill-opacity="0.14"/>
    <ellipse cx="110" cy="170" rx="122" ry="100" fill="#B45309"/>
    <ellipse cx="42" cy="96" rx="36" ry="58" transform="rotate(-24 42 96)" fill="#92400E"/>
    <ellipse cx="178" cy="96" rx="36" ry="58" transform="rotate(24 178 96)" fill="#92400E"/>
    <ellipse cx="110" cy="132" rx="78" ry="72" fill="#D97706"/>
    <ellipse cx="110" cy="168" rx="44" ry="32" fill="#FDE68A"/>
    <ellipse cx="110" cy="152" rx="18" ry="13" fill="#451A03"/>
    <circle cx="80" cy="112" r="8" fill="#451A03"/>
    <circle cx="140" cy="112" r="8" fill="#451A03"/>
    <path d="M92 182 Q110 204 128 182" stroke="#451A03" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M110 186 Q110 214 88 220" stroke="#F472B6" stroke-width="8" stroke-linecap="round" fill="none" transform="translate(4 -2)"/>
    <ellipse cx="70" cy="176" rx="16" ry="10" fill="#FCA5A5" fill-opacity="0.55"/>
    <ellipse cx="150" cy="176" rx="16" ry="10" fill="#FCA5A5" fill-opacity="0.55"/>
  </g>
  <g transform="translate(220 210)">
    <rect x="-10" y="20" width="420" height="250" rx="18" fill="#1E293B"/>
    <rect x="0" y="0" width="400" height="240" rx="16" fill="#334155"/>
    <rect x="0" y="0" width="400" height="240" rx="16" fill="url(#sun)" fill-opacity="0.08"/>
    <g font-family="'Courier New', monospace" font-size="13" fill="#CBD5E1">
      <text x="28" y="48"><tspan fill="#F472B6">const</tspan> <tspan fill="#93C5FD">naps</tspan> = <tspan fill="#FDE047">'strategic'</tspan>;</text>
      <text x="28" y="78"><tspan fill="#F472B6">while</tspan> (keyboard.<tspan fill="#93C5FD">isWarm</tspan>()) {</text>
      <text x="52" y="108"><tspan fill="#86EFAC">// human is typing, this is mine now</tspan></text>
      <text x="52" y="138">sleep(<tspan fill="#FBBF24">8</tspan>);</text>
      <text x="28" y="168">}</text>
      <text x="28" y="198"><tspan fill="#F472B6">return</tspan> <tspan fill="#FDE047">'productivity++'</tspan>;</text>
    </g>
    <rect x="288" y="174" width="84" height="4" rx="2" fill="#94A3B8" fill-opacity="0.4"/>
  </g>
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <text x="64" y="84" font-size="22" font-weight="700" fill="#78350F">Employee of the month</text>
    <text x="64" y="116" font-size="15" fill="#92400E">Sit. Stay. Ship.</text>
  </g>
</svg>
