@let inc = incoming();
@let prof = callerProfile();

@if (inc && prof) {
  <div class="fixed inset-0 z-[250] flex items-center justify-center p-4">
    <!-- Backdrop blur -->
    <div class="absolute inset-0 bg-black/60 backdrop-blur-md"></div>

    <!-- Dialog Card -->
    <div class="relative w-full max-w-sm overflow-hidden rounded-[2rem] border border-white/15 bg-[#101221]/95 p-7 text-center shadow-2xl backdrop-blur-2xl animate-pop">
      <!-- Concentric animated sonar rings behind avatar -->
      <div class="relative mx-auto mb-5 flex h-24 w-24 items-center justify-center">
        <div class="absolute -inset-4 rounded-full border border-accent/40 animate-ping opacity-60"></div>
        <div class="absolute -inset-8 rounded-full border border-accent/20 animate-pulse"></div>
        <div class="absolute inset-0 rounded-full bg-accent-soft blur-lg"></div>

        <div class="relative h-20 w-20 overflow-hidden rounded-full ring-4 ring-accent">
          <app-user-avatar [profile]="prof" [size]="80" />
        </div>
      </div>

      <h3 class="text-lg font-extrabold tracking-tight text-white">
        {{ inc.initiator.displayName }}
      </h3>
      <p class="text-xs text-white/60">&#64;{{ inc.initiator.handle }}</p>

      <div class="mt-2 inline-flex items-center gap-1.5 rounded-full border border-accent/30 bg-accent-soft px-3 py-1 text-xs font-semibold text-accent">
        @if (inc.type === 'video') {
          <svg lucideVideo [size]="13"></svg>
          Incoming Video Call…
        } @else {
          <svg lucidePhone [size]="13"></svg>
          Incoming Voice Call…
        }
      </div>

      <!-- Action buttons -->
      <div class="mt-7 flex items-center justify-center gap-4">
        <!-- Decline -->
        <button
          type="button"
          class="flex flex-col items-center gap-1.5 group"
          (click)="call.declineIncomingCall()"
        >
          <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-rose-600 text-white shadow-lg transition duration-200 group-hover:bg-rose-500 group-active:scale-95">
            <svg lucidePhoneOff [size]="22"></svg>
          </span>
          <span class="text-[0.68rem] font-medium text-white/70">Decline</span>
        </button>

        <!-- Accept with Audio -->
        @if (inc.type === 'video') {
          <button
            type="button"
            class="flex flex-col items-center gap-1.5 group"
            (click)="call.answerIncomingCall(false)"
          >
            <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-white/10 text-white/90 shadow-lg transition duration-200 group-hover:bg-white/20 group-active:scale-95">
              <svg lucidePhone [size]="22"></svg>
            </span>
            <span class="text-[0.68rem] font-medium text-white/70">Audio Only</span>
          </button>
        }

        <!-- Accept Video (or Audio if audio call) -->
        <button
          type="button"
          class="flex flex-col items-center gap-1.5 group"
          (click)="call.answerIncomingCall(inc.type === 'video')"
        >
          <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 text-white shadow-[0_0_30px_rgba(16,185,129,0.35)] transition duration-200 group-hover:brightness-110 group-active:scale-95">
            @if (inc.type === 'video') {
              <svg lucideVideo [size]="22"></svg>
            } @else {
              <svg lucidePhone [size]="22"></svg>
            }
          </span>
          <span class="text-[0.68rem] font-semibold text-emerald-400">Accept</span>
        </button>
      </div>
    </div>
  </div>
}
