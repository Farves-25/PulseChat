@let p = participant();

<div
  class="participant-tile group relative flex h-full w-full flex-col items-center justify-center overflow-hidden rounded-2xl border border-[var(--border-strong)] bg-[#0c0d16] transition-all duration-300"
  [class.ring-2]="isSpeaking()"
  [class.ring-emerald-500]="isSpeaking()"
  [class.shadow-[0_0_30px_rgba(16,185,129,0.25)]]="isSpeaking()"
  [class.ring-accent]="isPinned()"
>
  <!-- Background video stream -->
  <video
    #videoEl
    class="absolute inset-0 h-full w-full object-cover transition-opacity duration-300"
    [class.opacity-0]="!hasVideoStream()"
    [class.opacity-100]="hasVideoStream()"
    [class.object-contain]="screenSharing()"
    [class.scale-x-[-1]]="p.isLocal && !screenSharing()"
    autoplay
    playsinline
    [muted]="p.isLocal"
  ></video>

  <!-- Avatar placeholder when camera is off -->
  @if (!hasVideoStream()) {
    <div class="relative flex flex-col items-center justify-center gap-3 p-4 text-center animate-fade-up">
      <div class="relative">
        @if (isSpeaking()) {
          <div class="absolute -inset-3 rounded-full bg-emerald-500/20 blur-md animate-pulse"></div>
          <div class="absolute -inset-1.5 rounded-full border-2 border-emerald-400 animate-ping opacity-60"></div>
        }
        <div class="relative flex h-20 w-20 items-center justify-center rounded-full bg-gradient-to-tr from-accent/30 to-accent-2/30 p-1 shadow-card sm:h-24 sm:w-24">
          <app-user-avatar
            [profile]="{
              id: p.id,
              display_name: p.displayName,
              handle: p.handle,
              avatar_url: p.avatarUrl,
              status_message: null,
              presence: 'online'
            }"
            [size]="80"
          />
        </div>
      </div>
      <div class="flex flex-col items-center">
        <span class="text-sm font-bold text-white/95">{{ p.displayName }}</span>
        <span class="text-[0.7rem] text-white/50">&#64;{{ p.handle }}</span>
      </div>
    </div>
  }

  <!-- Screen share active badge -->
  @if (screenSharing()) {
    <div class="absolute left-3 top-3 z-10 flex items-center gap-1.5 rounded-full border border-sky-400/30 bg-sky-950/80 px-2.5 py-1 text-[0.65rem] font-bold text-sky-300 shadow-md backdrop-blur-md">
      <svg lucideScreenShare [size]="12"></svg>
      <span>Screen Sharing</span>
    </div>
  }

  <!-- Participant Overlay Badge (Bottom) -->
  <div class="absolute inset-x-2 bottom-2 z-10 flex items-center justify-between rounded-xl bg-black/60 px-3 py-1.5 backdrop-blur-md sm:inset-x-3 sm:bottom-3">
    <div class="flex min-w-0 items-center gap-2">
      <!-- Speaking / Mic status indicator -->
      @if (audioMuted()) {
        <span class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-rose-500/20 text-rose-400" title="Microphone muted">
          <svg lucideMicOff [size]="11"></svg>
        </span>
      } @else if (isSpeaking()) {
        <span class="flex h-5 items-center gap-0.5 rounded-full bg-emerald-500/20 px-1.5 text-emerald-400" title="Speaking">
          <span class="h-2 w-0.5 animate-[equalizer_0.6s_ease-in-out_infinite] rounded-full bg-emerald-400"></span>
          <span class="h-3 w-0.5 animate-[equalizer_0.4s_ease-in-out_infinite_0.1s] rounded-full bg-emerald-400"></span>
          <span class="h-1.5 w-0.5 animate-[equalizer_0.5s_ease-in-out_infinite_0.2s] rounded-full bg-emerald-400"></span>
        </span>
      } @else {
        <span class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-white/10 text-white/70" title="Microphone active">
          <svg lucideMic [size]="11"></svg>
        </span>
      }

      <span class="truncate text-xs font-semibold text-white/90">
        {{ p.displayName }}
        @if (p.isLocal) {
          <span class="ml-1 text-[0.65rem] font-normal text-white/60">(You)</span>
        }
      </span>
    </div>

    <!-- Tile action buttons -->
    <div class="flex items-center gap-1 opacity-0 transition-opacity group-hover:opacity-100">
      <button
        type="button"
        class="flex h-6 w-6 items-center justify-center rounded-lg bg-white/10 text-white/80 transition hover:bg-white/20 hover:text-white"
        [class.text-accent]="isPinned()"
        [attr.aria-label]="isPinned() ? 'Unpin participant' : 'Pin participant to spotlight'"
        [title]="isPinned() ? 'Unpin' : 'Pin to spotlight'"
        (click)="pin.emit()"
      >
        <svg lucidePin [size]="12"></svg>
      </button>
    </div>
  </div>
</div>
