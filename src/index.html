<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>PulseChat — Team messaging with a pulse</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="PulseChat is a multi-channel team workspace with threads, mentions, reactions, realtime presence, and powerful search."
    />
    <meta name="theme-color" content="#07080d" />
    <meta property="og:title" content="PulseChat — Team messaging with a pulse" />
    <meta
      property="og:description"
      content="Channels, threads, mentions, presence, and everything your team needs to stay in sync."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('pulsechat.theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var dark = theme ? theme === 'dark' : !prefersLight;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var accent = localStorage.getItem('pulsechat.accent');
          if (accent === 'violet') accent = 'red';
          document.documentElement.dataset.accent = accent || 'red';
        } catch (error) {
          /* Keep the dark default. */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
